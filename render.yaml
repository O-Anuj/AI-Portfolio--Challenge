services:
  - type: web
    name: ai-portfolio-backend
    env: python
    rootDir: backend
    buildCommand: sh -lc '/usr/bin/env python3 -m pip install -r requirements.txt || /usr/bin/env python -m pip install -r requirements.txt'
    startCommand: sh -lc '/usr/bin/env python3 -m uvicorn app.main:app --host 0.0.0.0 --port "$PORT" || /usr/bin/env python -m uvicorn app.main:app --host 0.0.0.0 --port "$PORT"'