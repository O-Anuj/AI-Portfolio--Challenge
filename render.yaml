services:
  - type: web
    name: ai-portfolio-backend
    env: python
    rootDir: backend
    buildCommand: sh -lc 'PYTHON_BIN="$(command -v python3 || command -v python || true)"; if [ -z "$PYTHON_BIN" ]; then echo "Python 3 interpreter not found. Render build requires python3 or python on PATH." >&2; exit 127; fi; "$PYTHON_BIN" -m pip install -r requirements.txt'
    startCommand: sh -lc 'PYTHON_BIN="$(command -v python3 || command -v python || true)"; if [ -z "$PYTHON_BIN" ]; then echo "Python 3 interpreter not found. Render start requires python3 or python on PATH." >&2; exit 127; fi; "$PYTHON_BIN" -m uvicorn app.main:app --host 0.0.0.0 --port "$PORT"'