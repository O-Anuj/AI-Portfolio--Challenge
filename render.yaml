services:
  - type: web
    name: ai-portfolio-backend
    env: python
    rootDir: backend
    buildCommand: sh -lc 'PYTHON_BIN="$(command -v python3 || command -v python)"; exec "$PYTHON_BIN" -m pip install -r requirements.txt'
    startCommand: sh -lc 'PYTHON_BIN="$(command -v python3 || command -v python)"; exec "$PYTHON_BIN" -m uvicorn app.main:app --host 0.0.0.0 --port "$PORT"'